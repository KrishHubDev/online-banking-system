<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>OBS Login</title>
</head>
<body>
  <h1>Online Banking System - Login</h1>
  <!-- Static skeleton only: no authentication logic is implemented. -->
  <form>
    <label for="customer-id">Customer ID / Mobile Number</label>
    <input type="text" id="customer-id" name="customer_id">
    <label for="password">Password</label>
    <input type="password" id="password" name="password">
    <label for="otp">OTP</label>
    <input type="text" id="otp" name="otp" maxlength="6">
    <button type="submit">Log In</button>
  </form>
</body>
</html>
